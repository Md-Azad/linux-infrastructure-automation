- name: Validate supported operating system
  ansible.builtin.import_tasks: validate_os.yml
- name: install common tool/packages
  ansible.builtin.import_tasks: install_common_tool/install.yml
- name: validate common tool/packages
  ansible.builtin.import_tasks: install_common_tool/validate_common_tool.yml
- name: install and enabled chrony package in all os
  ansible.builtin.import_tasks: chrony/install.yml
- name: Print Service facts
  ansible.builtin.import_tasks: chrony/validate_chrony.yml
- name: install and configure SSH package
  ansible.builtin.import_tasks: ssh/configure_ssh.yml
- name: Validate SSH Configuration
  ansible.builtin.import_tasks: ssh/validate_ssh.yml
- name: User and group management
  ansible.builtin.import_tasks: user_management/create_user_group.yml
- name: Validate user and group
  ansible.builtin.import_tasks: user_management/validate_user_group.yml
- name: Install firewall and open port for ssh
  ansible.builtin.import_tasks: firewall/firewalld.yml
- name: Validate Firewall configureation
  ansible.builtin.import_tasks: firewall/validate.yml
- name: Validate resource limit
  ansible.builtin.import_tasks: validation/validate_limit.yml
